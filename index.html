<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Tasks" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>My Tasks</title>
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      const workerUrl = new URL('./push/onesignal/OneSignalSDKWorker.js', window.location.href);
      const workerScopeUrl = new URL('./push/onesignal/', window.location.href);
      try {
        await OneSignal.init({
          appId: "73708780-d0d6-49c0-8e8c-debed904066d",
          serviceWorkerPath: workerUrl.pathname,
          serviceWorkerParam: { scope: workerScopeUrl.pathname },
          autoResubscribe: true
        });
        console.log('OneSignal initialized');
      } catch (error) {
        console.error('OneSignal initialization failed:', error);
      }
    });
  </script>

  <style>
    :root{
      --bg:#f5f7fb; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --primary:#111827; --accent:#2563eb; --green:#16a34a; --yellow:#ca8a04; --orange:#ea580c; --red:#dc2626;
      --shadow:0 8px 30px rgba(17,24,39,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:1200px;margin:0 auto;padding:22px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notify-btn{background:#fff;border:1px solid var(--line);color:var(--text)}.notify-btn.enabled{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    .title-wrap h1{margin:0;font-size:30px}.title-wrap p{margin:4px 0 0;color:var(--muted)}
    .btn{border:none;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--primary);color:#fff}.btn-light{background:#fff;border:1px solid var(--line);color:var(--text)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
    .stat .n{font-size:28px;font-weight:800}.stat .label{font-size:13px;color:var(--muted);margin-top:2px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .section{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
    .section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
    .section-head h2{margin:0;font-size:18px}.section-head span{color:var(--muted);font-size:13px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:#fafafa}
    th.sortable{cursor:pointer;user-select:none}
    th.sortable:hover{color:var(--text);background:#f3f4f6}
    th.sortable .sort-indicator{font-size:10px;margin-left:4px;color:var(--muted)}
    tbody tr:hover{background:#fafafa}
    .task-title{font-weight:800}.task-note{font-size:12px;color:var(--muted);margin-top:4px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:12px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:700;white-space:nowrap}
    .type-job{background:#dbeafe;color:#1d4ed8}.type-home{background:#dcfce7;color:#166534}.type-personal{background:#f3e8ff;color:#7e22ce}.type-other{background:#f3f4f6;color:#374151}
    .badge[class*="type-"],.badge[class*="prio-"]{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:700}
    #taskType{font-weight:800}
    .prio-low{background:#ecfdf5;color:#047857}.prio-normal{background:#f3f4f6;color:#374151}.prio-high{background:#fff7ed;color:#c2410c}.prio-critical{background:#fef2f2;color:#b91c1c}
    .time-ok{color:var(--green);font-weight:800}.time-soon{color:var(--yellow);font-weight:800}.time-urgent{color:var(--orange);font-weight:800}.time-due{color:var(--red);font-weight:900}.time-overdue{color:#991b1b;font-weight:900}
    select.status{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;min-width:125px}
    .actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;cursor:pointer}
    .empty{padding:28px;text-align:center;color:var(--muted)}
    .completed-list{display:grid;gap:10px;padding:14px}
    .completed-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .completed-card .left{min-width:0}.completed-card .task-title{text-decoration:line-through;color:#4b5563}
    .mobile-cards{display:none;padding:12px}
    .task-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
    .task-card .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.task-card .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.task-card .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px}.task-card .dates div{background:#f9fafb;padding:9px;border-radius:10px}.task-card .card-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
    dialog{border:none;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 28px);box-shadow:0 24px 80px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(17,24,39,.55)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{margin:0}.modal-body{padding:18px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 11px;font:inherit}.field textarea{min-height:84px;resize:vertical}
    .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--line)}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}.danger{color:var(--red)}
    @media(max-width:850px){.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}.notify-btn{padding:10px 12px}.stats{grid-template-columns:repeat(2,1fr)}.desktop-table{display:none}.mobile-cards{display:block}.app{padding:14px}.title-wrap h1{font-size:24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-wrap">
      <h1>My Tasks</h1>
      <p>Record, track and complete your tasks on time. <span id="syncState" style="font-size:12px;margin-left:6px">Connecting…</span></p>
    </div>
    <div class="top-actions">
      <button id="enableNotificationsBtn" class="btn notify-btn" type="button" onclick="enablePushNotifications()">🔔 Enable Notifications</button>
      <button class="btn btn-primary" onclick="openTaskModal()">＋ Add Task</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="pendingCount">0</div><div class="label">Pending</div></div>
    <div class="stat"><div class="n" id="dueSoonCount">0</div><div class="label">Due Soon</div></div>
    <div class="stat"><div class="n" id="overdueCount">0</div><div class="label">Overdue</div></div>
  </div>

  <div class="toolbar" id="filters">
    <button class="chip active" data-filter="all">All Tasks</button>
    <button class="chip" data-filter="today">Today</button>
    <button class="chip" data-filter="dueSoon">Due Soon</button>
    <button class="chip" data-filter="overdue">Overdue</button>
  </div>

  <section class="section">
    <div class="section-head"><h2>My Pending Tasks</h2><span id="pendingLabel"></span></div>
    <div class="desktop-table">
      <table>
        <thead><tr><th>Task</th><th>Type</th><th id="priorityHeader" class="sortable" title="Click to sort by priority">Priority <span class="sort-indicator" id="prioritySortIndicator">↕</span></th><th>Status</th><th>Since</th><th>Reminder</th><th>Deadline</th><th>Time Left</th><th></th></tr></thead>
        <tbody id="pendingBody"></tbody>
      </table>
    </div>
    <div class="mobile-cards" id="mobilePending"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>My Completed Tasks</h2><span id="completedLabel"></span></div>
    <div id="completedList" class="completed-list"></div>
  </section>
</div>

<dialog id="taskDialog">
  <form id="taskForm" method="dialog">
    <div class="modal-head"><h3 id="modalTitle">Add Task</h3><button type="button" class="icon-btn" onclick="closeTaskModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="taskId" />
      <div class="grid">
        <div class="field full"><label>Task name *</label><input id="taskName" required placeholder="e.g. Prepare monthly QA report" /></div>
        <div class="field full"><label>Description / Notes</label><textarea id="taskNotes" placeholder="Optional task details"></textarea></div>
        <div class="field"><label>Type</label><select id="taskType"><option>Job</option><option>Home</option><option>Personal</option><option>Other</option></select></div>
        <div class="field"><label>Priority</label><select id="taskPriority"><option>Normal</option><option>High</option><option>Critical</option><option>Low</option></select></div>
        <div class="field"><label>Status</label><select id="taskStatus"><option>Pending</option><option>In Progress</option><option>Postponed</option><option>Redo</option><option>Completed</option><option>Cancelled</option></select></div>
        <div class="field"><label>Start date</label><input type="date" id="taskStart" /></div>
        <div class="field"><label>Reminder date</label><input type="date" id="taskReminderDate" /></div>
        <div class="field"><label>Reminder time</label><input type="time" id="taskReminderTime" /></div>
        <div class="field"><label>Deadline date *</label><input type="date" id="taskDeadline" required /></div>
        <div class="field"><label>Deadline time</label><input type="time" id="taskDeadlineTime" /></div>
        
      </div>
      <div class="hint">Tasks sync to your Supabase backend. Push notifications can be connected next.</div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-light" onclick="closeTaskModal()">Cancel</button><button type="submit" class="btn btn-primary">Save Task</button></div>
  </form>
</dialog>

<script>
const SUPABASE_URL='https://hegddozeaqdztyyhsazr.supabase.co';
const SUPABASE_KEY='sb_publishable_zss60vbps4U1fbVbqGT5IQ_oaxsbaiy';
const TASKS_ENDPOINT=`${SUPABASE_URL}/rest/v1/tasks`;
const STORAGE_KEY='mytasks_v1'; // kept only as an offline cache
let oneSignalReady=false;
let tasks=[];
let currentFilter='all';
let allTaskSort='newest';


function updateNotificationButton(permission, subscribed){
  const btn=document.getElementById('enableNotificationsBtn');
  if(!btn)return;
  if(subscribed===true){
    btn.textContent='🔔 Notifications On';
    btn.classList.add('enabled');
    btn.style.display='none';
  }else if(permission==='denied'){
    btn.textContent='🔕 Notifications Blocked';
    btn.classList.remove('enabled');
    btn.style.display='inline-flex';
  }else{
    btn.textContent='🔔 Enable Notifications';
    btn.classList.remove('enabled');
    btn.style.display='inline-flex';
  }
}

async function ensureOneSignalSubscription(OneSignal, showResult){
  const permission = OneSignal.Notifications.permission;
  if(permission){
    await OneSignal.User.PushSubscription.optIn();
    for(let i=0;i<20;i++){
      const id=OneSignal.User.PushSubscription.id;
      const opted=OneSignal.User.PushSubscription.optedIn;
      if(id && opted){
        updateNotificationButton(permission,true);
        if(showResult) alert('Notifications are enabled and this device is subscribed.');
        return id;
      }
      await new Promise(r=>setTimeout(r,500));
    }
    updateNotificationButton(permission,false);
    if(showResult) alert('Notification permission is allowed, but OneSignal has not created the push subscription yet. Close and reopen the app, then try again.');
    return null;
  }
  updateNotificationButton(permission,false);
  return null;
}

function enablePushNotifications(){
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal){
    try{
      const supported = await OneSignal.Notifications.isPushSupported();
      if(!supported){
        alert('Push notifications are not supported in this browser/device. On iPhone, open the app from the Home Screen and use iOS 16.4 or newer.');
        return;
      }
      if(!OneSignal.Notifications.permission){
        await OneSignal.Notifications.requestPermission();
      }
      await ensureOneSignalSubscription(OneSignal,true);
    }catch(err){
      console.error('Notification subscription error:',err);
      alert('Could not complete the OneSignal subscription. Please reopen the app and try again.');
    }
  });
}

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  oneSignalReady=true;
  try{
    await ensureOneSignalSubscription(OneSignal,false);
  }catch(err){
    console.error('OneSignal auto-subscribe check failed:',err);
  }
  OneSignal.Notifications.addEventListener('permissionChange', async function(permission){
    if(permission){
      try{ await ensureOneSignalSubscription(OneSignal,false); }catch(err){ console.error(err); }
    }else{
      updateNotificationButton(permission,false);
    }
  });
  OneSignal.User.PushSubscription.addEventListener('change', function(event){
    const c=event.current || {};
    updateNotificationButton(OneSignal.Notifications.permission, !!(c.id && c.optedIn));
    console.log('OneSignal subscription changed', c);
  });
});

const todayISO=()=>{const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10)};
const fmt=(s)=> s ? new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function daysUntil(date){const a=new Date(todayISO()+'T00:00:00'); const b=new Date(date+'T00:00:00'); return Math.round((b-a)/86400000)}
function dueInfo(t){const d=daysUntil(t.deadline); if(d<0)return {text:`Overdue by ${Math.abs(d)} day${Math.abs(d)==1?'':'s'}`,cls:'time-overdue'}; if(d===0)return{text:'Due today',cls:'time-due'}; if(d===1)return{text:'1 day left',cls:'time-urgent'}; if(d<=3)return{text:`${d} days left`,cls:'time-soon'}; return{text:`${d} days left`,cls:'time-ok'} }
function isDone(t){return t.status==='Completed'||t.status==='Cancelled'}
function isDueSoon(t){const d=daysUntil(t.deadline); return d>=1&&d<=3}
function matchesFilter(t){if(currentFilter==='all')return true; if(currentFilter==='today')return t.deadline===todayISO()||t.reminderDate===todayISO(); if(currentFilter==='dueSoon')return isDueSoon(t); if(currentFilter==='overdue')return daysUntil(t.deadline)<0; return true}
function typeClass(type){return 'type-'+String(type||'other').toLowerCase()}
function prioClass(p){return 'prio-'+String(p||'normal').toLowerCase()}

function apiHeaders(extra={}){
  return {
    'apikey':SUPABASE_KEY,
    'Authorization':`Bearer ${SUPABASE_KEY}`,
    'Content-Type':'application/json',
    ...extra
  };
}
function rowToTask(r){
  return {
    id:r.id,
    name:r.task_name||'',
    notes:r.description||'',
    type:r.task_type||'Other',
    priority:r.priority||'Normal',
    status:r.status||'Pending',
    start:r.start_date||'',
    reminderDate:r.reminder_date||'',
    reminderTime:r.reminder_time ? String(r.reminder_time).slice(0,5) : '',
    deadline:r.deadline_date||'',
    deadlineTime:r.deadline_time ? String(r.deadline_time).slice(0,5) : '',
    createdAt:r.created_at||'',
    completedAt:r.completed_at||''
  };
}
function taskToRow(t){
  return {
    id:t.id,
    task_name:t.name,
    description:t.notes||null,
    task_type:t.type,
    priority:t.priority,
    status:t.status,
    start_date:t.start||null,
    reminder_date:t.reminderDate||null,
    reminder_time:t.reminderTime||null,
    deadline_date:t.deadline||null,
    deadline_time:t.deadlineTime||null,
    completed_at:t.completedAt||null
  };
}
function cacheTasks(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}
function setSyncMessage(message,isError=false){
  const el=document.getElementById('syncState');
  if(!el)return;
  el.textContent=message;
  el.style.color=isError?'#dc2626':'#6b7280';
}
async function loadTasks(){
  setSyncMessage('Syncing…');
  try{
    const res=await fetch(`${TASKS_ENDPOINT}?select=*&order=created_at.desc`,{headers:apiHeaders()});
    if(!res.ok)throw new Error(await res.text());
    tasks=(await res.json()).map(rowToTask);
    cacheTasks();
    setSyncMessage('Synced');
  }catch(err){
    console.error('Supabase load error:',err);
    tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    setSyncMessage('Offline / backend access failed',true);
  }
  render();
}
async function insertTask(t){
  const res=await fetch(TASKS_ENDPOINT,{method:'POST',headers:apiHeaders({'Prefer':'return=representation'}),body:JSON.stringify(taskToRow(t))});
  if(!res.ok)throw new Error(await res.text());
  const rows=await res.json();
  return rows[0] ? rowToTask(rows[0]) : t;
}
async function updateTaskRemote(t){
  const res=await fetch(`${TASKS_ENDPOINT}?id=eq.${encodeURIComponent(t.id)}`,{method:'PATCH',headers:apiHeaders({'Prefer':'return=representation'}),body:JSON.stringify(taskToRow(t))});
  if(!res.ok)throw new Error(await res.text());
  const rows=await res.json();
  return rows[0] ? rowToTask(rows[0]) : t;
}
async function deleteTaskRemote(id){
  const res=await fetch(`${TASKS_ENDPOINT}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:apiHeaders()});
  if(!res.ok)throw new Error(await res.text());
}

function render(){
  const pending=tasks.filter(t=>!isDone(t)); const completed=tasks.filter(t=>isDone(t));
  document.getElementById('pendingCount').textContent=pending.length;
  document.getElementById('dueSoonCount').textContent=pending.filter(isDueSoon).length;
  document.getElementById('overdueCount').textContent=pending.filter(t=>daysUntil(t.deadline)<0).length;
  let shown=pending.filter(matchesFilter);
  if(currentFilter==='all'){
    if(allTaskSort==='priority'){
      const rank={Critical:4,High:3,Normal:2,Low:1};
      shown.sort((a,b)=>(rank[b.priority]||0)-(rank[a.priority]||0) || (b.createdAt||'').localeCompare(a.createdAt||''));
    }else{
      shown.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    }
  }else{
    shown.sort((a,b)=>a.deadline.localeCompare(b.deadline));
  }
  const priorityHeader=document.getElementById('priorityHeader');
  const priorityIndicator=document.getElementById('prioritySortIndicator');
  priorityHeader.classList.toggle('sortable',currentFilter==='all');
  priorityHeader.title=currentFilter==='all' ? 'Click to sort by priority' : 'Priority sorting is available in All Tasks';
  priorityIndicator.textContent=currentFilter==='all' ? (allTaskSort==='priority'?'↓':'↕') : '';
  document.getElementById('pendingLabel').textContent=`${shown.length} shown`;
  document.getElementById('completedLabel').textContent=`${completed.length} task${completed.length===1?'':'s'}`;

  const body=document.getElementById('pendingBody'); body.innerHTML='';
  const mob=document.getElementById('mobilePending'); mob.innerHTML='';
  if(!shown.length){body.innerHTML='<tr><td colspan="9"><div class="empty">No tasks in this view.</div></td></tr>'; mob.innerHTML='<div class="empty">No tasks in this view.</div>'}
  shown.forEach(t=>{
    const due=dueInfo(t);
    body.insertAdjacentHTML('beforeend',`<tr>
      <td><div class="task-title">${esc(t.name)}</div><div class="task-note">${esc(t.notes||'')}</div></td>
      <td><span class="badge ${typeClass(t.type)}">${esc(t.type)}</span></td>
      <td><span class="badge ${prioClass(t.priority)}">${esc(t.priority)}</span></td>
      <td><select class="status" onchange="changeStatus('${t.id}',this.value)">${['Pending','In Progress','Postponed','Redo','Completed','Cancelled'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td>${fmt(t.start)}</td><td>${fmt(t.reminderDate)}${t.reminderTime?' '+t.reminderTime:''}</td><td>${fmt(t.deadline)}</td><td class="${due.cls}">${due.text}</td>
      <td><div class="actions"><button class="icon-btn" onclick="editTask('${t.id}')">✎</button><button class="icon-btn" onclick="deleteTask('${t.id}')">🗑</button></div></td>
    </tr>`);
    mob.insertAdjacentHTML('beforeend',`<div class="task-card">
      <div class="row"><div><div class="task-title">${esc(t.name)}</div><div class="task-note">${esc(t.notes||'')}</div></div><div class="${due.cls}">${due.text}</div></div>
      <div class="meta"><span class="badge ${typeClass(t.type)}">${esc(t.type)}</span><span class="badge ${prioClass(t.priority)}">${esc(t.priority)}</span></div>
      <div class="dates"><div><strong>Since</strong><br>${fmt(t.start)}</div><div><strong>Reminder</strong><br>${fmt(t.reminderDate)}${t.reminderTime?' '+t.reminderTime:''}</div><div><strong>Deadline</strong><br>${fmt(t.deadline)}</div><div><strong>Status</strong><br>${esc(t.status)}</div></div>
      <div class="card-actions"><select class="status" onchange="changeStatus('${t.id}',this.value)">${['Pending','In Progress','Postponed','Redo','Completed','Cancelled'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><div><button class="icon-btn" onclick="editTask('${t.id}')">✎</button> <button class="icon-btn" onclick="deleteTask('${t.id}')">🗑</button></div></div>
    </div>`);
  });

  const cl=document.getElementById('completedList'); cl.innerHTML='';
  if(!completed.length){cl.innerHTML='<div class="empty">No completed tasks yet.</div>'}
  completed.sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).forEach(t=>cl.insertAdjacentHTML('beforeend',`<div class="completed-card"><div class="left"><div class="task-title">${esc(t.name)}</div><div class="task-note">${esc(t.type)} · ${t.status}${t.completedAt?' · '+new Date(t.completedAt).toLocaleString():''}</div></div><div class="actions"><button class="icon-btn" onclick="editTask('${t.id}')">✎</button><button class="icon-btn" onclick="deleteTask('${t.id}')">🗑</button></div></div>`));
}

function openTaskModal(){
  document.getElementById('modalTitle').textContent='Add Task'; document.getElementById('taskForm').reset(); document.getElementById('taskId').value='';
  document.getElementById('taskStart').value=todayISO(); document.getElementById('taskDeadline').value=todayISO(); syncReminderLimit(); document.getElementById('taskDialog').showModal();
}
function closeTaskModal(){document.getElementById('taskDialog').close()}
function editTask(id){const t=tasks.find(x=>x.id===id); if(!t)return; document.getElementById('modalTitle').textContent='Edit Task'; document.getElementById('taskId').value=t.id; document.getElementById('taskName').value=t.name; document.getElementById('taskNotes').value=t.notes||''; document.getElementById('taskType').value=t.type; document.getElementById('taskPriority').value=t.priority; document.getElementById('taskStatus').value=t.status; document.getElementById('taskStart').value=t.start||''; document.getElementById('taskReminderDate').value=t.reminderDate||''; document.getElementById('taskReminderTime').value=t.reminderTime||''; document.getElementById('taskDeadline').value=t.deadline||''; document.getElementById('taskDeadlineTime').value=t.deadlineTime||''; syncReminderLimit(); document.getElementById('taskDialog').showModal()}
async function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  try{
    setSyncMessage('Saving…');
    await deleteTaskRemote(id);
    tasks=tasks.filter(t=>t.id!==id);
    cacheTasks(); render(); setSyncMessage('Synced');
  }catch(err){console.error(err); setSyncMessage('Delete failed',true); alert('Could not delete the task from Supabase. Check the backend permissions.');}
}
async function changeStatus(id,status){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const old={...t};
  t.status=status;
  if(status==='Completed'&&!t.completedAt)t.completedAt=new Date().toISOString();
  if(status!=='Completed')t.completedAt='';
  render();
  try{
    setSyncMessage('Saving…');
    const saved=await updateTaskRemote(t);
    Object.assign(t,saved); cacheTasks(); render(); setSyncMessage('Synced');
  }catch(err){Object.assign(t,old); render(); console.error(err); setSyncMessage('Update failed',true); alert('Could not update the task in Supabase.');}
}

function syncReminderLimit(){
  const deadline=document.getElementById('taskDeadline').value;
  const reminder=document.getElementById('taskReminderDate');
  reminder.max=deadline||'';
  validateReminderAgainstDeadline();
}
function validateReminderAgainstDeadline(){
  const rDate=document.getElementById('taskReminderDate');
  const rTime=document.getElementById('taskReminderTime');
  const dDate=document.getElementById('taskDeadline');
  const dTime=document.getElementById('taskDeadlineTime');
  rDate.setCustomValidity(''); rTime.setCustomValidity('');
  if(rDate.value && dDate.value && rDate.value>dDate.value){rDate.setCustomValidity('Reminder date cannot be after the deadline date.'); return false;}
  if(rDate.value && dDate.value && rDate.value===dDate.value && rTime.value && dTime.value && rTime.value>dTime.value){rTime.setCustomValidity('Reminder time cannot be after the deadline time.'); return false;}
  return true;
}
document.getElementById('taskDeadline').addEventListener('change',syncReminderLimit);
document.getElementById('taskDeadlineTime').addEventListener('change',validateReminderAgainstDeadline);
document.getElementById('taskReminderDate').addEventListener('change',validateReminderAgainstDeadline);
document.getElementById('taskReminderTime').addEventListener('change',validateReminderAgainstDeadline);

document.getElementById('priorityHeader').addEventListener('click',()=>{if(currentFilter!=='all')return; allTaskSort=allTaskSort==='priority'?'newest':'priority'; render();});

document.getElementById('taskForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!validateReminderAgainstDeadline()){e.target.reportValidity(); return;}
  const saveBtn=e.target.querySelector('button[type="submit"]');
  saveBtn.disabled=true; saveBtn.textContent='Saving…';
  const id=document.getElementById('taskId').value||crypto.randomUUID();
  const existing=tasks.find(t=>t.id===id);
  const status=document.getElementById('taskStatus').value;
  const obj={id,name:document.getElementById('taskName').value.trim(),notes:document.getElementById('taskNotes').value.trim(),type:document.getElementById('taskType').value,priority:document.getElementById('taskPriority').value,status,start:document.getElementById('taskStart').value,reminderDate:document.getElementById('taskReminderDate').value,reminderTime:document.getElementById('taskReminderTime').value,deadline:document.getElementById('taskDeadline').value,deadlineTime:document.getElementById('taskDeadlineTime').value,createdAt:existing?.createdAt||new Date().toISOString(),completedAt:existing?.completedAt||''};
  if(status==='Completed'&&!obj.completedAt)obj.completedAt=new Date().toISOString();
  if(status!=='Completed')obj.completedAt='';
  try{
    setSyncMessage('Saving…');
    const saved=existing ? await updateTaskRemote(obj) : await insertTask(obj);
    if(existing)Object.assign(existing,saved); else tasks.push(saved);
    cacheTasks(); render(); closeTaskModal(); setSyncMessage('Synced');
  }catch(err){
    console.error(err); setSyncMessage('Save failed',true);
    alert('Could not save this task to Supabase. If this is your first test, make sure the anon role has SELECT/INSERT/UPDATE/DELETE permission on the tasks table.');
  }finally{saveBtn.disabled=false; saveBtn.textContent='Save Task';}
});

document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]'); if(!b)return; currentFilter=b.dataset.filter; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===b)); render()});

loadTasks();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
